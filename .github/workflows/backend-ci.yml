name: backend-ci

# Puerta de CI para el backend (regla 5 de estabilización): todo PR que toque el
# API o las tareas qhld-tasks corre su suite de unidad antes de fusionar y desplegar.
# Solo unidad: la integración usa testcontainers (Docker) y no aplica en este gate.
on:
  pull_request:
    paths:
      - "api/**"
      - "packages/qhld-tasks/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
      - name: Sincronizar api
        working-directory: api
        run: uv sync --locked --dev
      - name: Tests de unidad (api)
        working-directory: api
        run: uv run pytest tests/unit -q

  qhld-tasks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
      - name: Sincronizar qhld-tasks
        working-directory: packages/qhld-tasks
        run: uv sync --locked --dev
      - name: Tests de unidad (qhld-tasks)
        working-directory: packages/qhld-tasks
        run: uv run pytest tests/unit -q
